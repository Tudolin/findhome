name: Deploy

# OPT-IN. Does nothing until you register a self-hosted runner on the server.
#
# ## Why this is opt-in and not the default
#
# The server accepts no inbound connections — it is behind a Cloudflare Tunnel or
# a Tailscale tailnet on purpose (DEPLOY-PUBLICO.md). GitHub therefore cannot
# connect to it, and any "deploy over SSH" workflow would require punching a hole
# through the thing the deployment guide spends nine steps closing.
#
# A self-hosted runner inverts the direction: it runs ON the server and polls
# GitHub over HTTPS, so nothing needs to be opened. That works — at a cost worth
# stating plainly before you enable it:
#
#   * The runner executes code from this repository on your machine. On a public
#     repo, that means anything a `pull_request_target` or a merged PR can reach.
#     Only use a self-hosted runner on a PRIVATE repository.
#   * It runs as whatever user installed it, with that user's Docker access —
#     which is root-equivalent.
#
# If that trade is not one you want, do not enable this. `deploy/update.sh` from
# cron achieves the same thing with none of it, and is what the README recommends.
#
# ## To enable
#
#   1. Settings → Actions → Runners → New self-hosted runner, on the server.
#   2. Give it the label `findhome-server`.
#   3. Run it as a service:  sudo ./svc.sh install && sudo ./svc.sh start
#   4. Actions → Deploy → Run workflow.

on:
  # Deliberately manual. An automatic deploy on every push to main is how a
  # laptop restarts mid-evening because someone fixed a typo in the README.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (latest, or a version like v1.4.0)'
        required: false
        default: 'latest'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # No runner with this label = the job queues and never starts, which is the
    # correct behaviour for something nobody has opted into.
    runs-on: [self-hosted, findhome-server]
    timeout-minutes: 20

    steps:
      # The working copy on the server, not a fresh checkout: .env lives there and
      # must never be in the repository.
      - name: Update and restart
        run: |
          cd "${FINDHOME_DIR:-$HOME/findhome}"
          git fetch --all --prune
          git reset --hard origin/main
          ./deploy/update.sh --tag "${{ inputs.tag }}"

      - name: What is running
        if: always()
        run: |
          cd "${FINDHOME_DIR:-$HOME/findhome}"
          docker compose ps
