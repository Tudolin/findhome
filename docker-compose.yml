# FindHome — single-file orchestration for a Linux home server.
#
#   docker compose up -d --build
#
# Services:
#   db       PostgreSQL 16 with a persistent named volume
#   migrate  one-shot: applies Prisma migrations, then exits
#   web      Next.js app (UI + REST API)
#   scraper  headless Playwright engine on an internal cron
#
# Everything talks over the private `findhome` bridge network. Only `web`
# publishes a port, and it binds to ${BIND_ADDRESS} (0.0.0.0 by default so the
# LAN can reach it — set it to 127.0.0.1 when a reverse proxy fronts the app).

name: findhome

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-findhome}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-findhome}?schema=public&connection_limit=5

services:
  db:
    image: postgres:16-alpine
    container_name: findhome-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findhome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-findhome}
      # Speeds up initdb and keeps collation stable across host locales.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Drop pg_dump output here: docker compose exec db pg_dump ... > /backups/x.sql
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-findhome} -d ${POSTGRES_DB:-findhome}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [findhome]
    # Uncomment ONLY if you need a desktop SQL client on the LAN.
    # ports:
    #   - '${BIND_ADDRESS:-127.0.0.1}:5432:5432'
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-512M}

  migrate:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: tools
    container_name: findhome-migrate
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy
    # One-shot: runs `prisma migrate deploy` (the image CMD) and exits 0.
    restart: 'no'
    networks: [findhome]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runner
    container_name: findhome-web
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # --- Public feed --------------------------------------------------------
      # Listings a visitor sees at `/` before the sign-up gate, and how long the
      # public queries are cached in-process. The gate is a product decision, not
      # a security boundary — everything shown is already public on the portals.
      PUBLIC_FEED_LIMIT: ${PUBLIC_FEED_LIMIT:-20}
      PUBLIC_FEED_CACHE_MS: ${PUBLIC_FEED_CACHE_MS:-60000}
      # --- Login hardening ----------------------------------------------------
      # bcrypt work factor. Each step doubles the cost of a login AND of cracking
      # a stolen hash. 12 is ~250ms; raise it if your CPU can take it.
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # Consecutive wrong passwords before the account locks, and for how long.
      # This survives a container restart; the in-memory limiter does not.
      LOGIN_LOCK_THRESHOLD: ${LOGIN_LOCK_THRESHOLD:-8}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      # How long sign-in attempts stay readable on the Security screen.
      LOGIN_AUDIT_DAYS: ${LOGIN_AUDIT_DAYS:-90}
      # Purchase-cost estimate rates, in percent. ITBI is MUNICIPAL — check the
      # rate for your city; 2% and 3% are both common. Read at runtime (not
      # NEXT_PUBLIC_, which Next would inline at build time and ignore here).
      ITBI_PCT: ${ITBI_PCT:-3}
      DEED_PCT: ${DEED_PCT:-1}
      REGISTRY_PCT: ${REGISTRY_PCT:-0.8}
      MAX_PARTY_MEMBERS: ${MAX_PARTY_MEMBERS:-6}
      TZ: ${TZ:-America/Sao_Paulo}
      # Lets the app's "Scrape now" button reach the scraper's control API over
      # the private network. The token never leaves the server side.
      SCRAPER_CONTROL_URL: http://scraper:${SCRAPE_CONTROL_PORT:-8080}
      SCRAPE_CONTROL_TOKEN: ${SCRAPE_CONTROL_TOKEN:-}
      # Read only to tell the user on the Preferences screen whether alerts can
      # actually be delivered. The scraper is what sends them.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      # Absolute base for the calendar-subscription URL. Only needed when a
      # reverse proxy or tunnel means the request headers are not enough.
      APP_ORIGIN: ${APP_ORIGIN:-}
      # The photo mirror. Same path in both containers, so it is one setting
      # rather than two that have to agree. `web` only ever reads it.
      MEDIA_ROOT: /media
    volumes:
      - media:/media:ro
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [findhome]
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-512M}

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
      target: runner
    container_name: findhome-scraper
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      TZ: ${TZ:-America/Sao_Paulo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCRAPE_CRON: ${SCRAPE_CRON:-0 8,20 * * *}
      SCRAPE_SOURCES: ${SCRAPE_SOURCES:-DEMO}
      SCRAPE_ON_START: ${SCRAPE_ON_START:-true}
      SCRAPE_MAX_PAGES: ${SCRAPE_MAX_PAGES:-2}
      SCRAPE_PAGE_SIZE: ${SCRAPE_PAGE_SIZE:-40}
      SCRAPE_DELAY_MS: ${SCRAPE_DELAY_MS:-1500}
      SCRAPE_STALE_DAYS: ${SCRAPE_STALE_DAYS:-21}
      SCRAPE_DEFAULT_CITY: ${SCRAPE_DEFAULT_CITY:-São Paulo}
      SCRAPE_DEFAULT_STATE: ${SCRAPE_DEFAULT_STATE:-SP}
      # Control API for manual runs. Deliberately NOT in `ports:` — it is
      # reachable only from inside this network, which is where `web` lives.
      SCRAPE_CONTROL_ENABLED: ${SCRAPE_CONTROL_ENABLED:-true}
      SCRAPE_CONTROL_PORT: ${SCRAPE_CONTROL_PORT:-8080}
      SCRAPE_CONTROL_TOKEN: ${SCRAPE_CONTROL_TOKEN:-}
      # Escape hatches for when a portal moves its endpoint (see `make doctor`).
      GRUPOZAP_ENDPOINT: ${GRUPOZAP_ENDPOINT:-}
      QUINTOANDAR_ENDPOINT: ${QUINTOANDAR_ENDPOINT:-}
      # WhatsApp alerts. The scraper sends them, because it is what discovers a
      # new listing in the first place.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN:-}
      WHATSAPP_CLOUD_TOKEN: ${WHATSAPP_CLOUD_TOKEN:-}
      WHATSAPP_CLOUD_PHONE_ID: ${WHATSAPP_CLOUD_PHONE_ID:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-pt_BR}
      WHATSAPP_CALLMEBOT_APIKEY: ${WHATSAPP_CALLMEBOT_APIKEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_MAX_AGE_HOURS: ${ALERT_MAX_AGE_HOURS:-48}
      # Gallery backfill. OLX, Chaves na Mão and ImovelWeb publish one photo in
      # their search results; the rest of the gallery only exists on the listing's
      # own page, so a second pass opens it. On by default — it reuses the
      # Chromium the scrape already launched — and bounded per run.
      PHOTOS_ENABLED: ${PHOTOS_ENABLED:-true}
      PHOTOS_MAX_PER_RUN: ${PHOTOS_MAX_PER_RUN:-200}
      # 0 = no gate: every listing gets its page opened once, whatever the search
      # response already gave us. Set it to N to skip listings that already have
      # N photos, at the cost of never finding the rest of their album.
      PHOTOS_MIN_IMAGES: ${PHOTOS_MIN_IMAGES:-0}
      # 0 = store every photo found. There is no reason to throw away photo 16.
      PHOTOS_MAX_PER_LISTING: ${PHOTOS_MAX_PER_LISTING:-0}
      PHOTOS_DELAY_MS: ${PHOTOS_DELAY_MS:-900}
      PHOTOS_SETTLE_MS: ${PHOTOS_SETTLE_MS:-1200}
      PHOTOS_TIMEOUT_MS: ${PHOTOS_TIMEOUT_MS:-30000}
      # --- Photo mirror -------------------------------------------------------
      # Downloads the photo FILES to the shared `media` volume, so a shortlisted
      # flat's gallery survives the portal expiring its URLs — and so OLX photos
      # work at all (its CDN refuses the browser's Referer; the scraper can send
      # the right one because it fetches server-side).
      MEDIA_ROOT: /media
      PHOTOS_MIRROR: ${PHOTOS_MIRROR:-true}
      PHOTOS_MIRROR_MAX_MB: ${PHOTOS_MIRROR_MAX_MB:-2048}
      PHOTOS_MIRROR_MAX_PER_RUN: ${PHOTOS_MIRROR_MAX_PER_RUN:-400}
      PHOTOS_MIRROR_DELAY_MS: ${PHOTOS_MIRROR_DELAY_MS:-120}
      PHOTOS_MIRROR_MAX_FILE_KB: ${PHOTOS_MIRROR_MAX_FILE_KB:-4096}
      PHOTOS_MIRROR_MAX_FAILURES: ${PHOTOS_MIRROR_MAX_FAILURES:-3}
      PHOTOS_MIRROR_TIMEOUT_MS: ${PHOTOS_MIRROR_TIMEOUT_MS:-20000}
      # --- Cleanup ------------------------------------------------------------
      # Deletes inactive listings NOBODY HAS TOUCHED after this many days, and
      # reclaims their photo files. A listing with a rating, status, pin, comment
      # or booked visit is never deleted — see scraper/src/cleanup.ts.
      # 0 disables deletion entirely.
      CLEANUP_PURGE_DAYS: ${CLEANUP_PURGE_DAYS:-60}
      CLEANUP_MAX_PER_RUN: ${CLEANUP_MAX_PER_RUN:-2000}
      # A closed ad keeps this many mirrored photos; the rest are released back to
      # the disk budget. One cover is enough to recognise the flat in a shortlist,
      # and twenty of a place nobody can rent is what fills the budget. 0 keeps all.
      CLEANUP_ARCHIVE_KEEP: ${CLEANUP_ARCHIVE_KEEP:-1}
      # Waited out first, because portals re-post: an ad back within the week finds
      # its gallery intact instead of re-downloading twenty files.
      CLEANUP_ARCHIVE_DAYS: ${CLEANUP_ARCHIVE_DAYS:-7}
      # --- Same flat, several ads --------------------------------------------
      # Groups ads that agree on location, size and layout. Conservative on
      # purpose: a false merge hides a listing permanently, a missed one is a
      # visible annoyance. Listings with no coordinates are never clustered.
      DEDUPE_ENABLED: ${DEDUPE_ENABLED:-true}
      DEDUPE_RADIUS_M: ${DEDUPE_RADIUS_M:-60}
      DEDUPE_AREA_PCT: ${DEDUPE_AREA_PCT:-5}
      DEDUPE_MAX_PER_RUN: ${DEDUPE_MAX_PER_RUN:-5000}
      # --- Commute times ------------------------------------------------------
      # OFF by default: it needs a routing provider.
      #   osrm  self-hosted (docker run osrm/osrm-backend) — free and unlimited
      #   ors   OpenRouteService, free key covers ~2000/day
      # The public OSRM demo server is donated infrastructure with a no-heavy-use
      # policy. Do not point this at it.
      COMMUTE_PROVIDER: ${COMMUTE_PROVIDER:-none}
      COMMUTE_ENDPOINT: ${COMMUTE_ENDPOINT:-}
      COMMUTE_API_KEY: ${COMMUTE_API_KEY:-}
      COMMUTE_MAX_PER_RUN: ${COMMUTE_MAX_PER_RUN:-200}
      COMMUTE_DELAY_MS: ${COMMUTE_DELAY_MS:-250}
      # Coordinates for the map, for the portals that publish none. Off by
      # default because Nominatim is donated infrastructure — see src/geocode.ts.
      GEOCODE_ENABLED: ${GEOCODE_ENABLED:-false}
      GEOCODE_ENDPOINT: ${GEOCODE_ENDPOINT:-}
      GEOCODE_MAX_PER_RUN: ${GEOCODE_MAX_PER_RUN:-25}
      GEOCODE_DELAY_MS: ${GEOCODE_DELAY_MS:-1100}
      GEOCODE_CONTACT: ${GEOCODE_CONTACT:-}
    volumes:
      # Read-write here: the scraper is the only writer. `web` mounts it :ro.
      - media:/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Chromium's default 64MB /dev/shm is not enough and it will crash on
    # image-heavy pages. src/browser.ts also passes --disable-dev-shm-usage.
    shm_size: ${SCRAPER_SHM_SIZE:-512mb}
    # Probes the control API (src/healthcheck.ts). Exits 0 when the control API
    # is switched off, so disabling it does not mark the container unhealthy.
    healthcheck:
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    networks: [findhome]
    deploy:
      resources:
        limits:
          memory: ${SCRAPER_MEMORY_LIMIT:-1G}

volumes:
  pgdata:
    name: findhome-pgdata
  # Mirrored listing photos. Written by `scraper`, read by `web`.
  #
  # A named volume rather than a bind mount so the ownership set by the images
  # (uid 1001 in both) is what the volume is initialised with — a host directory
  # would come in root-owned and the scraper could not write to it.
  #
  # Sized by PHOTOS_MIRROR_MAX_MB (2 GB by default), not by the disk.
  media:
    name: findhome-media

networks:
  findhome:
    name: findhome
    driver: bridge
  # --- Reverse proxy (Nginx Proxy Manager / Traefik) -------------------------
  # NPM and Traefik can only route to a container they share a network with.
  # Uncomment the block below, add `proxy` to the `web` service's networks, and
  # set BIND_ADDRESS=127.0.0.1 so the app is reachable only through the proxy.
  #
  # proxy:
  #   external: true
  #   name: proxy
