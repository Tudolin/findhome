# FindHome — plain Nginx reverse proxy (Debian/Ubuntu).
#
#   sudo cp deploy/nginx-findhome.conf /etc/nginx/sites-available/findhome
#   sudo ln -s /etc/nginx/sites-available/findhome /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# With this in place set BIND_ADDRESS=127.0.0.1 in .env so the app is no longer
# reachable directly on port 3000 from the LAN, and re-run `docker compose up -d`.

upstream findhome_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Use whatever hostname your LAN DNS / Pi-hole / hosts file resolves.
    server_name findhome.home.arpa findhome.local;

    # Listing photo carousels and multi-image uploads.
    client_max_body_size 20m;

    # Next.js immutable build assets — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://findhome_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mirrored listing photos. Content-addressed (the path is a hash of the
    # portal's URL), so the bytes behind a path can never change — cache as hard
    # as the build assets. The app sets the same header itself; this just keeps
    # nginx from second-guessing it.
    location /media/ {
        proxy_pass http://findhome_app;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://findhome_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Required for Next.js HMR/streaming responses.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}

